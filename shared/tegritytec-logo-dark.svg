<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHQ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D19"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="globeGradHQ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="goldGradHQ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="waveGradHQ" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGradHQ)" stroke="#1E293B" stroke-width="2"/>

  <!-- EMBLEM GRAPHIC -->
  <g transform="translate(45, 30) scale(0.52)">
    <!-- Outer Ring -->
    <circle cx="250" cy="250" r="210" fill="none" stroke="url(#globeGradHQ)" stroke-width="8" opacity="0.8" filter="url(#neonGlow)"/>
    <path d="M 40 250 A 210 110 0 0 0 460 250 A 210 110 0 0 0 40 250 Z" fill="none" stroke="url(#globeGradHQ)" stroke-width="3" stroke-dasharray="6,4" opacity="0.5"/>
    <path d="M 250 40 A 110 210 0 0 0 250 460 A 110 210 0 0 0 250 40 Z" fill="none" stroke="url(#globeGradHQ)" stroke-width="3" stroke-dasharray="6,4" opacity="0.5"/>

    <!-- T Letterform -->
    <path d="M 120 140 H 380 C 380 140, 360 185, 290 185 H 280 V 380 C 280 410, 260 425, 250 425 C 240 425, 220 410, 220 380 V 185 H 210 C 140 185, 120 140, 120 140 Z" 
          fill="#0F172A" stroke="#38BDF8" stroke-width="4" />

    <!-- Wave Arc -->
    <path d="M 70 300 C 140 240, 210 320, 290 230 C 330 185, 390 190, 430 250 C 370 230, 310 280, 250 340 C 180 410, 100 370, 70 300 Z" 
          fill="url(#waveGradHQ)" opacity="0.95"/>

    <!-- Financial Gold Arc -->
    <path d="M 160 380 C 220 360, 300 300, 390 170 C 400 155, 420 140, 435 150 C 445 160, 430 180, 410 210 C 320 340, 230 410, 160 380 Z" 
          fill="url(#goldGradHQ)"/>

    <!-- Neural Nodes -->
    <circle cx="220" cy="90" r="10" fill="#38BDF8" filter="url(#neonGlow)"/>
    <circle cx="410" cy="100" r="10" fill="#F59E0B" filter="url(#neonGlow)"/>
    <circle cx="80" cy="210" r="10" fill="#00B4D8" filter="url(#neonGlow)"/>
    <circle cx="440" cy="360" r="10" fill="#60A5FA" filter="url(#neonGlow)"/>
  </g>

  <!-- LOGOTYPE TEXT -->
  <text x="320" y="165" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" letter-spacing="1" fill="#FFFFFF">
    Tegrity<tspan fill="#38BDF8">Tec</tspan>
  </text>

  <!-- TAGLINE: INNOVATION • INTEGRITY -->
  <text x="325" y="225" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="8" fill="#94A3B8">
    INNOVATION <tspan fill="#F59E0B">•</tspan> INTEGRITY
  </text>
</svg>
