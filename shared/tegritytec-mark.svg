<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="tLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Globe Ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#globeGrad)" stroke-width="6" opacity="0.4" />

  <!-- Globe Latitude / Longitude Lattice -->
  <path d="M 40 250 A 210 110 0 0 0 460 250 A 210 110 0 0 0 40 250 Z" fill="none" stroke="url(#globeGrad)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.35" />
  <path d="M 250 40 A 110 210 0 0 0 250 460 A 110 210 0 0 0 250 40 Z" fill="none" stroke="url(#globeGrad)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.35" />

  <!-- Central Interwoven 'T' (Technology & Integrity) -->
  <path d="M 120 140 H 380 C 380 140, 360 185, 290 185 H 280 V 380 C 280 410, 260 425, 250 425 C 240 425, 220 410, 220 380 V 185 H 210 C 140 185, 120 140, 120 140 Z" 
        fill="url(#tLetterGrad)" stroke="#38BDF8" stroke-width="3" />

  <!-- Shipping / Maritime Wave Crest -->
  <path d="M 70 300 C 140 240, 210 320, 290 230 C 330 185, 390 190, 430 250 C 370 230, 310 280, 250 340 C 180 410, 100 370, 70 300 Z" 
        fill="url(#waveGrad)" opacity="0.9" />

  <!-- Financial Ascending Arc (Gold) -->
  <path d="M 160 380 C 220 360, 300 300, 390 170 C 400 155, 420 140, 435 150 C 445 160, 430 180, 410 210 C 320 340, 230 410, 160 380 Z" 
        fill="url(#goldGrad)" />

  <!-- AI Neural Network Nodes & Connections -->
  <line x1="160" y1="140" x2="220" y2="90" stroke="#38BDF8" stroke-width="3" stroke-dasharray="3,3"/>
  <line x1="340" y1="140" x2="410" y2="100" stroke="#F59E0B" stroke-width="3" stroke-dasharray="3,3"/>
  <line x1="120" y1="280" x2="80" y2="210" stroke="#00B4D8" stroke-width="3" stroke-dasharray="3,3"/>
  <line x1="380" y1="320" x2="440" y2="360" stroke="#38BDF8" stroke-width="3" stroke-dasharray="3,3"/>

  <circle cx="220" cy="90" r="10" fill="#38BDF8" filter="url(#nodeGlow)"/>
  <circle cx="410" cy="100" r="10" fill="#F59E0B" filter="url(#nodeGlow)"/>
  <circle cx="80" cy="210" r="10" fill="#00B4D8" filter="url(#nodeGlow)"/>
  <circle cx="440" cy="360" r="10" fill="#60A5FA" filter="url(#nodeGlow)"/>
  <circle cx="250" cy="250" r="8" fill="#FCE7F3" filter="url(#nodeGlow)"/>
</svg>
